<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>庫存盤點</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1e6f5c" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="lib/bootstrap.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* 跟主系統（wwwroot/css/design-system.css）共用同一套色票，兩邊維持一致的品牌識別 */
    :root {
      --ink: #1C2321;
      --ink-soft: #4A534E;
      --paper: #F7F6F2;
      --teal: #1E6F5C;
      --teal-deep: #154F42;
      --teal-tint: #E4EFEC;
      --amber: #B45309;
      --amber-deep: #92400E;
      --amber-tint: #FBF0E2;
      --rose: #B3261E;
      --rose-tint: #FAEAE8;
      --line: #DDD8CC;
      --line-soft: #EAE7DD;
    }
    body { padding-bottom: 24px; background: var(--paper); color: var(--ink); font-family: "Noto Sans TC", "Segoe UI", system-ui, sans-serif; }

    /* Bootstrap 把每個按鈕變體的顏色編譯成寫死的 hex，逐一覆寫成同一套色票（跟主系統作法一致） */
    .btn { font-weight: 600; }
    .btn-primary {
      --bs-btn-bg: var(--teal); --bs-btn-border-color: var(--teal);
      --bs-btn-hover-bg: var(--teal-deep); --bs-btn-hover-border-color: var(--teal-deep);
      --bs-btn-active-bg: var(--teal-deep); --bs-btn-active-border-color: var(--teal-deep);
      --bs-btn-disabled-bg: var(--teal); --bs-btn-disabled-border-color: var(--teal);
    }
    .btn-outline-primary {
      --bs-btn-color: var(--teal); --bs-btn-border-color: var(--teal);
      --bs-btn-hover-bg: var(--teal); --bs-btn-hover-border-color: var(--teal);
      --bs-btn-active-bg: var(--teal); --bs-btn-active-border-color: var(--teal);
    }
    .btn-success {
      --bs-btn-bg: var(--teal); --bs-btn-border-color: var(--teal);
      --bs-btn-hover-bg: var(--teal-deep); --bs-btn-hover-border-color: var(--teal-deep);
      --bs-btn-active-bg: var(--teal-deep); --bs-btn-active-border-color: var(--teal-deep);
    }
    .btn-outline-success {
      --bs-btn-color: var(--teal-deep); --bs-btn-border-color: var(--teal);
      --bs-btn-hover-bg: var(--teal); --bs-btn-hover-border-color: var(--teal);
      --bs-btn-active-bg: var(--teal); --bs-btn-active-border-color: var(--teal);
    }
    .btn-danger {
      --bs-btn-bg: var(--rose); --bs-btn-border-color: var(--rose);
      --bs-btn-hover-bg: #8f1e18; --bs-btn-hover-border-color: #8f1e18;
      --bs-btn-active-bg: #8f1e18; --bs-btn-active-border-color: #8f1e18;
    }
    .btn-outline-danger {
      --bs-btn-color: var(--rose); --bs-btn-border-color: var(--rose);
      --bs-btn-hover-bg: var(--rose); --bs-btn-hover-border-color: var(--rose);
      --bs-btn-active-bg: var(--rose); --bs-btn-active-border-color: var(--rose);
    }
    .btn-outline-warning {
      --bs-btn-color: var(--amber); --bs-btn-border-color: var(--amber);
      --bs-btn-hover-bg: var(--amber); --bs-btn-hover-border-color: var(--amber); --bs-btn-hover-color: #fff;
      --bs-btn-active-bg: var(--amber); --bs-btn-active-border-color: var(--amber); --bs-btn-active-color: #fff;
    }
    .btn-outline-info {
      --bs-btn-color: var(--teal-deep); --bs-btn-border-color: var(--teal);
      --bs-btn-hover-bg: var(--teal); --bs-btn-hover-border-color: var(--teal); --bs-btn-hover-color: #fff;
      --bs-btn-active-bg: var(--teal); --bs-btn-active-border-color: var(--teal); --bs-btn-active-color: #fff;
    }
    .btn-info { --bs-btn-bg: var(--teal); --bs-btn-border-color: var(--teal); --bs-btn-hover-bg: var(--teal-deep); --bs-btn-hover-border-color: var(--teal-deep); --bs-btn-color: #fff; --bs-btn-hover-color: #fff; }
    .btn-outline-dark {
      --bs-btn-color: var(--ink); --bs-btn-border-color: var(--ink);
      --bs-btn-hover-bg: var(--ink); --bs-btn-hover-border-color: var(--ink);
      --bs-btn-active-bg: var(--ink); --bs-btn-active-border-color: var(--ink);
    }
    .btn-outline-secondary {
      --bs-btn-color: var(--ink-soft); --bs-btn-border-color: var(--line);
      --bs-btn-hover-bg: var(--line-soft); --bs-btn-hover-border-color: var(--ink-soft); --bs-btn-hover-color: var(--ink);
      --bs-btn-active-bg: var(--line-soft); --bs-btn-active-border-color: var(--ink-soft); --bs-btn-active-color: var(--ink);
    }
    .form-control:focus, .form-select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-tint); }
    .badge.bg-secondary { background-color: var(--ink-soft) !important; }
    .badge.bg-warning { background-color: var(--amber-tint) !important; color: var(--amber) !important; }
    .modal-content { border: 1px solid var(--line); border-radius: 8px; }
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }
    .status-banner { padding: 10px 16px; font-size: 0.9rem; text-align: center; }
    .status-banner.ok { background: var(--teal-tint); color: var(--teal-deep); }
    .status-banner.warn { background: var(--amber-tint); color: var(--amber); }
    .status-banner.offline { background: var(--rose-tint); color: var(--rose); }
    .big-btn { font-size: 1.1rem; padding: 18px; }
    .item-row { cursor: pointer; }
    .item-row .badge-counted { background: var(--teal-deep); }
    .item-row .badge-uncounted { background: var(--ink-soft); }
    .item-row .badge-pending { background: var(--amber); }
    #reader { width: 100%; }
    .scanner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 16px; }
    .keypad-display { font-size: 3rem; text-align: center; padding: 16px; background: var(--line-soft); border-radius: 8px; margin-bottom: 12px; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .keypad-grid button { font-size: 1.5rem; padding: 18px 0; }
    .entry-list li { display: flex; justify-content: space-between; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    /* 規格/批號/效期在倉庫現場要看得清楚，比一般輔助文字大一號、不用淡色 */
    .item-attrs { font-size: 0.95rem; color: var(--ink); }
    /* 規格與批號同一行，用直線明確區隔 */
    .attr-sep { color: var(--ink-soft); padding: 0 8px; opacity: .5; }
    /* 品號、批號是倉庫現場辨識品項的主要依據，放大加粗 */
    .item-no-lg { font-size: 1.15rem; font-weight: 700; }
    .lot-no-lg { font-size: 1.05rem; font-weight: 700; background: var(--amber-tint); color: var(--amber); padding: 1px 8px; border-radius: 4px; }
    .calc-row button { font-size: 1.3rem; padding: 14px 0; }
    /* 開始盤點頁面：上方（人員/搜尋）用淺底卡片，跟下方（選盤點階段）明顯區隔 */
    .input-panel { background: var(--teal-tint); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    .test-mode-toggle { background: var(--amber-tint); border: 1px solid #F0D2A8; border-radius: 10px; padding: 12px 14px; }
    /* 測試模式：整個 app 換成橘色系並在最上方壓一條固定橫幅。
       刻意做得很明顯——最怕的不是測試資料汙染正式，而是有人在測試模式盤了一整個倉才發現不算數。 */
    #test-mode-bar {
      position: sticky; top: 0; z-index: 1500;
      background: repeating-linear-gradient(45deg, var(--amber), var(--amber) 12px, var(--amber-deep) 12px, var(--amber-deep) 24px);
      color: #fff; text-align: center; font-weight: 700; padding: 8px 12px; font-size: .95rem;
      letter-spacing: .04em; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    body.test-mode { background: var(--amber-tint); }
    body.test-mode .navbar, body.test-mode .bg-success { background-color: var(--amber) !important; }
    body.test-mode .input-panel { background: #FBE4C6; }
    body.test-mode .btn-success { background-color: var(--amber); border-color: var(--amber); }
    body.test-mode .btn-outline-success { color: var(--amber-deep); border-color: var(--amber); }
    body.test-mode .item-row .badge-counted { background: var(--amber-deep); }
    .stage-divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 14px; color: var(--ink-soft); font-size: 0.85rem; }
    .stage-divider::before, .stage-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .stage-panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  </style>
</head>
<body>
  <div id="test-mode-bar" class="d-none">測試模式 — 此處盤點的數字不列入正式結果</div>
  <div id="conn-banner" class="status-banner warn">連線檢查中…</div>

  <!-- 登入畫面 -->
  <section id="screen-login" class="screen active">
    <h1 class="h4 mt-3">庫存盤點</h1>
    <form id="login-form" class="mt-4">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" required autocomplete="username" />
      </div>
      <div class="mb-3">
        <label class="form-label">密碼</label>
        <input type="password" class="form-control" id="login-password" required autocomplete="current-password" />
      </div>
      <div id="login-error" class="alert alert-danger d-none"></div>
      <button type="submit" class="btn btn-primary w-100 big-btn">登入</button>
    </form>
  </section>

  <!-- 選擇 初盤/複盤（跨公司，選完直接進品項畫面） -->
  <section id="screen-select" class="screen">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h5 mb-0">開始盤點</h1>
      <div>
        <span id="who" class="text-muted small me-2"></span>
        <button class="btn btn-outline-secondary btn-sm" id="logout-btn">登出</button>
      </div>
    </div>

    <div id="admin-tools-area" class="mb-3 d-none">
      <button class="btn btn-outline-success w-100" id="admin-confirm-btn">🗂️ 管理：確認完成盤點單</button>

      <!-- 測試模式開關只給管理者看見。一般盤點人員完全不會出現這個區塊，
           避免現場人員誤切到測試模式、盤了一整個倉結果數字不算數。 -->
      <div class="test-mode-toggle mt-3">
        <div class="form-check form-switch d-flex align-items-center gap-2 mb-0">
          <input class="form-check-input" type="checkbox" role="switch" id="test-mode-switch" />
          <label class="form-check-label" for="test-mode-switch">
            <strong>測試模式</strong>
            <span class="d-block text-muted" style="font-size: .8rem;">練習用，資料與正式盤點分開</span>
          </label>
        </div>
      </div>
    </div>

    <div class="input-panel">
      <div class="mb-3">
        <label class="form-label">目前盤點人員（必填）</label>
        <input type="text" class="form-control" id="operator-name-input" placeholder="必填：輸入姓名後才能開始盤點" />
      </div>

      <div class="mb-0">
        <label class="form-label">搜尋品項（跨公司，僅搜尋生效盤點單）</label>
        <div class="input-group">
          <input type="text" class="form-control" id="cross-search-input" placeholder="輸入品號/品名/批號關鍵字" />
          <button class="btn btn-outline-primary" type="button" id="cross-search-btn">搜尋</button>
        </div>
        <div id="cross-search-results" class="list-group mt-2"></div>
      </div>
    </div>

    <div class="stage-divider">開始盤點</div>

    <div class="stage-panel">
      <label class="form-label">盤點階段（跨公司，選擇後直接進入品項清單）</label>
      <div class="d-grid gap-2">
        <button class="btn btn-outline-primary big-btn select-type" data-type="初盤">初盤</button>
        <button class="btn btn-outline-primary big-btn select-type" data-type="複盤">複盤</button>
      </div>
    </div>
  </section>

  <!-- Admin：確認完成初盤/複盤（獨立頁面，只有管理員能看到入口） -->
  <section id="screen-admin-confirm" class="screen">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button class="btn btn-outline-secondary btn-sm" id="back-from-admin-confirm">← 返回</button>
      <h1 class="h5 mb-0">確認完成盤點單</h1>
      <span style="width: 3.5em"></span>
    </div>
    <div id="admin-confirm-list"></div>
  </section>

  <!-- 選倉庫 + 盤點項目表 -->
  <section id="screen-items" class="screen">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <button class="btn btn-outline-secondary btn-sm" id="back-to-select">← 返回</button>
      <span id="sheet-title" class="small text-muted"></span>
    </div>

    <div class="mb-2">
      <select class="form-select" id="warehouse-select">
        <option value="">請選擇倉庫名稱</option>
      </select>
    </div>

    <div class="mb-2">
      <div class="input-group mb-2">
        <input type="text" class="form-control" id="search-input" placeholder="🔍 搜尋品號關鍵字" />
        <button class="btn btn-outline-secondary" type="button" id="search-clear-btn">清除</button>
      </div>
      <div class="input-group">
        <input type="text" class="form-control" id="search-lot-input" placeholder="🔍 搜尋批號關鍵字" />
        <button class="btn btn-outline-secondary" type="button" id="search-lot-clear-btn">清除</button>
      </div>
    </div>
    <div class="d-grid mb-2">
      <button class="btn btn-outline-secondary btn-sm" id="scan-btn">📷 掃描產品條碼</button>
    </div>

    <div id="items-list"></div>
  </section>

  <!-- 數量輸入畫面 -->
  <section id="screen-count" class="screen">
    <button class="btn btn-outline-secondary btn-sm mb-2" id="back-to-items">← 返回品項表</button>
    <div id="count-item-info" class="mb-2"></div>

    <div id="correct-mode-hint" class="alert alert-warning py-2 d-none">更正模式：輸入正確的「已盤總數」，再按「強制更正數量」</div>
    <div class="keypad-display" id="keypad-display">0</div>
    <div class="keypad-grid mb-2">
      <button class="btn btn-outline-secondary" data-key="1">1</button>
      <button class="btn btn-outline-secondary" data-key="2">2</button>
      <button class="btn btn-outline-secondary" data-key="3">3</button>
      <button class="btn btn-outline-secondary" data-key="4">4</button>
      <button class="btn btn-outline-secondary" data-key="5">5</button>
      <button class="btn btn-outline-secondary" data-key="6">6</button>
      <button class="btn btn-outline-secondary" data-key="7">7</button>
      <button class="btn btn-outline-secondary" data-key="8">8</button>
      <button class="btn btn-outline-secondary" data-key="9">9</button>
      <button class="btn btn-outline-primary" data-key=".">.</button>
      <button class="btn btn-outline-secondary" data-key="0">0</button>
      <button class="btn btn-outline-warning" data-key="back">⌫</button>
    </div>
    <div class="d-flex gap-2 mb-2 calc-row">
      <button class="btn btn-outline-info flex-fill" id="calc-multiply-btn">×</button>
      <button class="btn btn-info flex-fill" id="calc-equals-btn">＝</button>
    </div>
    <div class="d-grid gap-2 mb-3">
      <div class="d-grid gap-2" id="normal-btns">
        <button class="btn btn-primary big-btn" id="submit-count-btn">送出</button>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-dark big-btn flex-fill" id="zero-stock-btn">無庫存（盤點數量 0）</button>
          <button class="btn btn-outline-success big-btn flex-fill d-none" id="correct-count-btn">更正總數</button>
          <button class="btn btn-outline-danger big-btn flex-fill" id="clear-btn">清除</button>
        </div>
      </div>
      <div class="d-flex gap-2 d-none" id="correct-mode-btns">
        <button class="btn btn-danger big-btn flex-fill" id="force-correct-btn">強制更正數量</button>
        <button class="btn btn-outline-secondary big-btn flex-fill" id="cancel-correct-btn">取消</button>
        <button class="btn btn-outline-danger big-btn flex-fill" id="clear-btn-correct">清除</button>
      </div>
    </div>
    <div id="count-submit-error" class="alert alert-danger d-none"></div>

    <h2 class="h6">已盤點明細</h2>
    <ul class="entry-list list-unstyled" id="entry-list"></ul>
  </section>

  <!-- 無庫存確認（改用自訂 Modal，不用原生 confirm()：安裝到主畫面的 standalone PWA 在部分瀏覽器
       原生 confirm()/alert() 會被靜默吃掉，導致 if(!confirm()) 直接 return、按鈕看起來毫無反應）-->
  <div class="modal fade" id="zero-stock-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">確認無庫存</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="zero-stock-modal-text" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-dark" id="zero-stock-modal-ok-btn">確定無庫存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 確認完成初盤/複盤（Admin 頁面用）：同樣改用自訂 Modal，並加一道防呆——
       要求 admin 在這裡重新輸入一次自己的姓名，避免手滑誤按。-->
  <div class="modal fade" id="admin-confirm-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">確認完成盤點單</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="admin-confirm-modal-text"></p>
          <label class="form-label">請再次輸入您的姓名以確認（必填）</label>
          <input type="text" class="form-control" id="admin-confirm-name-input" />
          <div class="alert alert-danger py-1 px-2 mt-2 d-none small" id="admin-confirm-modal-error"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-success" id="admin-confirm-modal-ok-btn">確認完成</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 掃描條碼疊層 -->
  <div id="scanner-overlay" class="scanner-overlay d-none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="text-white">掃描產品條碼</span>
      <button class="btn btn-light btn-sm" id="scanner-close">關閉</button>
    </div>
    <div id="reader"></div>
  </div>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="js/db.js"></script>
  <script src="app.js"></script>
</body>
</html>
