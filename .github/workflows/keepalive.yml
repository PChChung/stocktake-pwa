name: Supabase Keepalive

# 部署指南 §5：Supabase 免費版閒置會自動暫停。
# anon key 設計上就是公開的（config.js 裡本來就有），寫在這裡不是機密外洩。
# 這個 workflow 只碰 keepalive 表（RLS 只開放這張表給 anon insert/select），不會碰到任何盤點資料。
#
# 2026-11：原本每 2 天對 keepalive 表做一次 SELECT，仍連續第三次被判定閒置暫停
# （2026-08、2026-10、2026-11）。改成每天一次，且改成 INSERT 寫入一筆，
# 寫入比單純查詢更像是真正的活躍使用（schema.sql 已加對應的 insert 政策）。

on:
  schedule:
    # 每天 09:00 台灣時間 (UTC+8) = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch: # 允許在 GitHub Actions 頁面手動觸發，方便驗收測試

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert a keepalive row
        run: |
          curl -sS -o response.json -w "HTTP status: %{http_code}\n" \
            -X POST "https://yvolycibskromyqraijg.supabase.co/rest/v1/keepalive" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2b2x5Y2lic2tyb215cXJhaWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MjU0NTIsImV4cCI6MjA5OTMwMTQ1Mn0.laDjpe5-IYFiSDoISq_G8vUn2CMDtxd8pep92O3TeJ0" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data-raw '{}' \
            > status.txt
          cat status.txt
          echo "Response body:"
          cat response.json
          grep -q "HTTP status: 201" status.txt
